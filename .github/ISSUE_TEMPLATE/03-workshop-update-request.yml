name: Steam Workshop release update request
description: Request review of one or more existing Workshop release items.
title: "[Workshop update]: "
body:
  - type: markdown
    attributes:
      value: |
        Select one or more modules. This request does not itself authorize or start an upload.
        The owner must review the exact source commits and approve the request separately.
        The new automated release pipeline is not yet enabled or verified. Some modules are
        not release-ready and AI Gaming is paused. Do not include credentials or Steam Guard codes.
  - type: checkboxes
    id: modules
    attributes:
      label: Modules
      description: Select at least one module. A paused or unready module cannot be uploaded.
      options:
        - label: AI Improve
        - label: Automated Public Transport Planning
        - label: Automated Public Transport Vehicle Management
        - label: Full Map Unlock And Expansion
        - label: Intercity Resource Sharing
        - label: Realistic Border Control
        - label: Realistic City First Response
        - label: Realistic City Time
        - label: Realistic Import Export Control
        - label: Realistic Pedestrian Traffic Control
        - label: Realistic Railway Traffic Control
        - label: Realistic Urban Population
        - label: Realistic Vehicle Traffic Control
        - label: Wireless Utilities And Global Coverage
        - label: AI Gaming (paused)
  - type: textarea
    id: change_note
    attributes:
      label: Proposed Workshop change note
      description: Enter one English line of up to 240 characters, without double quotes or backslashes. It will become the public Steam change note and is never used as a command, path or item ID.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand this issue is a request and does not itself authorize or start an upload.
          required: true
# Signature: OpenAI-Codex_workshop_implementation.
