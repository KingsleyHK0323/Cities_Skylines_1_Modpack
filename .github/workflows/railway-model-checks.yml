name: Railway shadow model checks
on:
  push:
    branches: [Realistic_Railway_Traffic_Control]
    paths: ['Source/**', 'Checks/**', '.github/workflows/railway-model-checks.yml']
  pull_request:
    branches: [Realistic_Railway_Traffic_Control]
    paths: ['Source/**', 'Checks/**', '.github/workflows/railway-model-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile real pure-data model and behavior checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $locator = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $compiler = & $locator -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (-not $compiler) { throw 'Installed MSBuild was not found; no dependencies will be installed.' }
          & $compiler Checks/RailwayModelChecks.csproj /t:Rebuild /p:Configuration=Release /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run pure-data behavior checks (not game acceptance)
        shell: pwsh
        run: |
          & ./bin/ModelChecks/Release/RailwayModelChecks.exe
          exit $LASTEXITCODE
# Signature: OpenAI-Codex_Responsible: Realistic_Railway_Traffic_Control
