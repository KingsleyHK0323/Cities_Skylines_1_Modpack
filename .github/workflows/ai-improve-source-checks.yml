name: AI Improve source checks

on:
  push:
    branches:
      - AI_Improve
  pull_request:
    branches:
      - AI_Improve

permissions:
  contents: read

jobs:
  migration-boundaries:
    name: Validate migration inventory and negative cases
    if: github.repository == 'KingsleyHK0323/Cities_Skylines_1_Modpack' && (github.ref == 'refs/heads/AI_Improve' || github.base_ref == 'AI_Improve')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source and baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify hosted Python and baseline prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -B - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          if sys.version_info[:2] != (3, 12):
              raise SystemExit("Infrastructure prerequisite: expected hosted Python 3.12; no tests ran.")
          data = json.loads(Path("tools/migration/feature-boundaries.json").read_text(encoding="utf-8-sig"))
          baseline = data.get("sourceBaseline", "")
          if not isinstance(baseline, str) or not re.fullmatch(r"[0-9a-f]{40}", baseline):
              raise SystemExit("Inventory sourceBaseline is not a full commit SHA.")
          result = subprocess.run(["git", "cat-file", "-e", baseline + "^{commit}"])
          if result.returncode:
              raise SystemExit("Infrastructure prerequisite: baseline history unavailable; no tests ran.")
          print("Hosted Python and full baseline history available.")
          PY

      - name: Validate current source inventory
        shell: bash
        run: python3 -B tools/migration/check_feature_boundaries.py

      - name: Run boundary contract and negative tests
        shell: bash
        run: python3 -B -m unittest discover -s tools/migration -p 'test_feature_boundaries.py' -v

  localization-and-release-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check localization consistency
        run: |
          set -euo pipefail
          report="$(python3 tools/check_localization.py)"
          printf '%s\n' "$report"
          if printf '%s\n' "$report" | grep -Eq 'warning LOC[0-9]{3}:'; then
            echo "Localization findings must be resolved before merging." >&2
            exit 1
          fi

      - name: Verify development tools stay out of shipping compile
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          def compile_items(dev_tools):
              result = subprocess.run(
                  [
                      "dotnet", "msbuild", "AIImprove.csproj",
                      "-getItem:Compile", f"-p:DevTools={str(dev_tools).lower()}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              data = json.loads(result.stdout)
              return {
                  item["Identity"].replace("\\", "/")
                  for item in data["Items"]["Compile"]
              }

          dev_sources = {path.as_posix() for path in Path("dev").rglob("*.cs")}
          shipping = compile_items(False)
          development = compile_items(True)
          shipped_dev_sources = {path for path in shipping if path.startswith("dev/")}
          missing_dev_sources = dev_sources - development

          if shipped_dev_sources:
              print("Development-only sources entered the default compile:", sorted(shipped_dev_sources))
              sys.exit(1)
          if missing_dev_sources:
              print("DevTools=true did not include:", sorted(missing_dev_sources))
              sys.exit(1)
          print(f"Compile boundary OK: {len(dev_sources)} dev source files excluded by default and included with DevTools=true.")
          PY

# Author: OpenAI-Codex.
# Migration inventory wiring: OpenAI-Codex_AI_Improve.
