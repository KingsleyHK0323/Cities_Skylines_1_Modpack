# Signature: OpenAI-Codex_Responsible: Realistic_Import_Export_Control
name: Import Export pure model checks
on:
  push:
    branches: [Realistic_Import_Export_Control]
  pull_request:
    branches: [Realistic_Import_Export_Control]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run synthetic model checks
        run: dotnet run --project Tests/CargoModelChecks.csproj --configuration Release
