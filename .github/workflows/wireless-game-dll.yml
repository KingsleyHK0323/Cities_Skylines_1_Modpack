# Signature: OpenAI-Codex
name: Wireless Utilities foundation game DLL
on:
  push:
    branches: [Wireless_Utilities_And_Global_Coverage]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-dll:
    if: github.repository == 'KingsleyHK0323/Cities_Skylines_1_Modpack' && github.ref == 'refs/heads/Wireless_Utilities_And_Global_Coverage'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Check out pinned encrypted reference supply
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7b8a5e7c10f2db84388e8dd8af2084f239957b13
          path: build-dependencies
          persist-credentials: false
          sparse-checkout: |
            build-references/cs1/v1
            tools/build-references
      - name: Restore cloud-only references
        shell: pwsh
        env:
          CS1_GAME_REFERENCES_KEY: ${{ secrets.CS1_GAME_REFERENCES_KEY }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'wireless-utilities-references'
          & ./build-dependencies/tools/build-references/Restore-GameReferences.ps1 -BundleDirectory ./build-dependencies/build-references/cs1/v1 -GameRoot $root
          "WIRELESS_REFERENCE_ROOT=$root" >> $env:GITHUB_ENV
      - name: Compile observation DLL against explicit game references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdks = @(dotnet --list-sdks)
          if ($LASTEXITCODE) { throw 'Could not list hosted SDKs.' }
          $selected = $sdks | ForEach-Object {
            if ($_ -match '^(8\.0\.[0-9]+) \[(.+)\]$') {
              [pscustomobject]@{ Version = [version]$Matches[1]; Root = $Matches[2] }
            }
          } | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $selected) { throw 'No stable .NET 8 SDK is installed.' }
          $compiler = Join-Path $selected.Root "$($selected.Version)/Roslyn/bincore/csc.dll"
          Write-Host "Selected compiler SDK: $($selected.Version)"
          $managed = Join-Path $env:WIRELESS_REFERENCE_ROOT 'Cities_Data/Managed'
          $output = Join-Path $env:RUNNER_TEMP 'wireless-utilities-public'
          New-Item -ItemType Directory -Path $output | Out-Null
          $dll = Join-Path $output 'WirelessUtilitiesAndGlobalCoverage.dll'
          $arguments = @('/noconfig','/nostdlib+','/target:library','/langversion:3','/optimize+','/deterministic+',"/out:$dll")
          foreach ($name in @('mscorlib.dll','System.dll','System.Core.dll','UnityEngine.dll','ICities.dll','ColossalManaged.dll','Assembly-CSharp.dll')) {
            $reference = Join-Path $managed $name
            if (-not (Test-Path -LiteralPath $reference -PathType Leaf)) { throw 'Missing explicit reference.' }
            $arguments += "/reference:$reference"
          }
          # Compile the production sources, never a test harness with API stubs.
          $arguments += @(Get-ChildItem Source -Filter '*.cs' -File | Sort-Object FullName | ForEach-Object { $_.FullName })
          & dotnet $compiler @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $assembly = [Reflection.AssemblyName]::GetAssemblyName($dll)
          if ($assembly.Name -cne 'WirelessUtilitiesAndGlobalCoverage' -or (Get-Item $dll).Length -le 0) { throw 'Invalid output assembly.' }
          @{
            schemaVersion = 1
            sourceSHA = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            sharedReferencesSHA = '7b8a5e7c10f2db84388e8dd8af2084f239957b13'
            sha256 = (Get-FileHash $dll -Algorithm SHA256).Hash
            observationOnly = $true
            gameplayVerified = $false
            signature = 'OpenAI-Codex'
          } | ConvertTo-Json | Set-Content (Join-Path $output 'build-provenance.json') -Encoding utf8
          # Execute the production entry-point checks in an isolated cloud directory.
          $checks = Join-Path $env:RUNNER_TEMP 'wireless-entry-checks'
          New-Item -ItemType Directory -Path $checks | Out-Null
          $exe = Join-Path $checks 'EntryPointChecks.exe'
          $testArguments = @('/noconfig','/nostdlib+','/target:exe','/langversion:3',"/out:$exe","/reference:$dll")
          foreach ($name in @('mscorlib.dll','System.dll','System.Core.dll','ICities.dll','ColossalManaged.dll','UnityEngine.dll','Assembly-CSharp.dll')) {
            $testArguments += "/reference:$(Join-Path $managed $name)"
          }
          $testArguments += 'Checks/EntryPointChecks.cs'
          & dotnet $compiler @testArguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $dll -Destination $checks
          foreach ($name in @('ICities.dll','ColossalManaged.dll','UnityEngine.dll','Assembly-CSharp.dll')) {
            Copy-Item -LiteralPath (Join-Path $managed $name) -Destination $checks
          }
          Copy-Item -LiteralPath Checks/App.config -Destination "$exe.config"
          & $exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'Inactive foundation DLL. No utility control, cross-city effects or save writes. Gameplay remains unverified.' >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve only DLL and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wireless-utilities-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/wireless-utilities-public/WirelessUtilitiesAndGlobalCoverage.dll
            ${{ runner.temp }}/wireless-utilities-public/build-provenance.json
