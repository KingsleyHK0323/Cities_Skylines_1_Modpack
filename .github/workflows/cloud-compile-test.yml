name: APTP cloud compile test
# Signature: OpenAI-Codex_Responsible: Automated_Public_Transport_Planning
on:
  workflow_dispatch:
  push:
    branches: [Automated_Public_Transport_Planning]
permissions:
  contents: read
jobs:
  compile:
    # Signature: OpenAI-Codex_Automated_Public_Transport_Planning
    outputs:
      artifact-id: ${{ steps.public-assets.outputs.artifact-id }}
      build-attempt: ${{ steps.build-identity.outputs.attempt }}
    if: github.repository == 'KingsleyHK0323/Cities_Skylines_1_Modpack' && github.ref == 'refs/heads/Automated_Public_Transport_Planning'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record compile attempt
        id: build-identity
        shell: pwsh
        run: '"attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT'
      - name: Check release provenance contracts
        shell: pwsh
        run: |
          python -B -m unittest discover -s Tests -p test_release_provenance.py -v
          exit $LASTEXITCODE
      # Signature: OpenAI-Codex
      - name: Check independent Development build publisher contracts
        shell: pwsh
        run: |
          python -B tools/test_dev_build_publisher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/test_publish_aptp_development.py
          exit $LASTEXITCODE
      - name: Check out pinned encrypted references and restore helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7b8a5e7c10f2db84388e8dd8af2084f239957b13
          path: build-dependencies
          persist-credentials: false
          sparse-checkout: |
            build-references/cs1/v1
            tools/build-references
      - name: Restore authenticated game references
        shell: pwsh
        env:
          CS1_GAME_REFERENCES_KEY: ${{ secrets.CS1_GAME_REFERENCES_KEY }}
        run: |
          $gameRoot = Join-Path $env:RUNNER_TEMP 'cs1-game-root'
          & ./build-dependencies/tools/build-references/Restore-GameReferences.ps1 -BundleDirectory ./build-dependencies/build-references/cs1/v1 -GameRoot $gameRoot
          "CS1_GAME_ROOT=$gameRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Locate Visual Studio MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'Visual Studio MSBuild was not found.' }
          & $msbuild -version -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "APTP_MSBUILD=$msbuild" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check Release preview source boundary
        shell: pwsh
        run: |
          node --test Tests/ReleasePreviewBoundary.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check preview admission under controlled interleavings
        shell: pwsh
        run: ./Tests/Run-PlanningPreviewAdmissionSynthetic.ps1
      - name: Rebuild no-DevTools DLL in an isolated cloud directory
        shell: pwsh
        run: |
          $releaseOutput = Join-Path $env:RUNNER_TEMP 'aptp-release-verification'
          $releaseIntermediate = Join-Path $env:RUNNER_TEMP 'aptp-release-intermediate'
          & $env:APTP_MSBUILD AutomatedPublicTransportPlanning.csproj /t:Rebuild /p:Configuration=Release /p:DevTools=false /p:ModsDir= "/p:OutputPath=$releaseOutput/" "/p:IntermediateOutputPath=$releaseIntermediate/" "/p:CitiesSkylinesDir=$env:CS1_GAME_ROOT" "/p:CSInstallPath=$env:CS1_GAME_ROOT" /verbosity:normal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseDll = Join-Path $releaseOutput 'AutomatedPublicTransportPlanning.dll'
          if (-not (Test-Path -LiteralPath $releaseDll -PathType Leaf) -or (Get-Item -LiteralPath $releaseDll).Length -le 0 -or [Reflection.AssemblyName]::GetAssemblyName($releaseDll).Name -cne 'AutomatedPublicTransportPlanning') { throw 'The isolated Release DLL is missing or has the wrong identity.' }
          Write-Output 'Isolated no-DevTools compile passed. Game behavior is not verified.'
      # Signature: OpenAI-Codex.
      - name: Rebuild Development DLL against verified game references
        shell: pwsh
        run: |
          $gameRoot = $env:CS1_GAME_ROOT
          & $env:APTP_MSBUILD AutomatedPublicTransportPlanning.csproj /t:Rebuild /p:Configuration=Release /p:DevTools=true /p:ModsDir= "/p:CitiesSkylinesDir=$gameRoot" "/p:CSInstallPath=$gameRoot" /verbosity:normal /nologo
          exit $LASTEXITCODE
      - name: Assert compiled module outputs
        shell: pwsh
        run: |
          foreach ($name in @('AutomatedPublicTransportPlanning.dll', 'AutomatedPublicTransportPlanning.pdb')) {
            $file = Get-Item -LiteralPath (Join-Path 'bin/Release' $name) -ErrorAction Stop
            if ($file.Length -le 0) { throw "Compiled output is empty: $name" }
            Write-Host "$name exists and is nonempty ($($file.Length) bytes)."
          }
      # Signature: OpenAI-Codex_Responsible: Automated_Public_Transport_Planning
      - name: Build existing planning engine checks
        shell: pwsh
        run: |
          $checksOutput = Join-Path $env:RUNNER_TEMP 'aptp-planning-checks'
          & $env:APTP_MSBUILD Tests/PlanningEngineChecks.csproj "/p:OutputPath=$checksOutput/" /t:Rebuild /p:Configuration=Release /p:ModsDir= "/p:CitiesSkylinesDir=$env:CS1_GAME_ROOT" /verbosity:normal /nologo
          exit $LASTEXITCODE
      - name: Run pure-data planning checks under cloud CLR v4
        shell: pwsh
        run: |
          # This is a cloud test host, not the game's Mono runtime or in-game acceptance.
          $exe = Join-Path $env:RUNNER_TEMP 'aptp-planning-checks/PlanningEngineChecks.exe'
          '<configuration><startup useLegacyV2RuntimeActivationPolicy="true"><supportedRuntime version="v4.0" /></startup></configuration>' | Set-Content -LiteralPath "$exe.config" -Encoding utf8
          & $exe
          exit $LASTEXITCODE
      - name: Prepare whitelisted public assets
        shell: pwsh
        run: ./.github/scripts/Prepare-Release.ps1
      - name: Transfer only public assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: public-assets
        with:
          name: aptp-public-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aptp-release-assets/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: compile
    if: false && github.repository == 'KingsleyHK0323/Cities_Skylines_1_Modpack' && github.ref == 'refs/heads/Automated_Public_Transport_Planning'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate compile identity before download
        shell: bash
        env:
          RELEASE_ARTIFACT_ID: ${{ needs.compile.outputs.artifact-id }}
          RELEASE_BUILD_ATTEMPT: ${{ needs.compile.outputs.build-attempt }}
        run: |
          [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$RELEASE_BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.compile.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: release-assets
      - name: Create draft, verify uploaded assets, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.compile.outputs.artifact-id }}
          RELEASE_BUILD_ATTEMPT: ${{ needs.compile.outputs.build-attempt }}
        run: python3 .github/scripts/Publish-Release.py

  # Signature: OpenAI-Codex
  publish-development-build:
    needs: compile
    if: github.repository == 'KingsleyHK0323/Cities_Skylines_1_Modpack' && github.ref == 'refs/heads/Automated_Public_Transport_Planning'
    concurrency:
      group: development-build-automated-public-transport-planning
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the publisher at the built source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            tools
      - name: Receive the exact allowlisted compile artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.compile.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/aptp-release-assets
      - name: Verify provenance and publish the independent Development build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.compile.outputs.artifact-id }}
          RELEASE_BUILD_ATTEMPT: ${{ needs.compile.outputs.build-attempt }}
        run: python3 -B tools/publish_aptp_development.py '${{ runner.temp }}/aptp-release-assets'
