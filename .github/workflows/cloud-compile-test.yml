name: AI Improve Development build and prerelease
on:
  workflow_dispatch:
  push:
    branches: [AI_Improve]
permissions:
  contents: read
jobs:
  migration-boundaries:
    name: Validate migration inventory and negative cases
    if: github.repository == 'KingsleyHK0323/Cities_Skylines_1_Modpack' && github.ref == 'refs/heads/AI_Improve'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source and baseline history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify hosted Python and baseline prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -B - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          if sys.version_info[:2] != (3, 12):
              raise SystemExit("Infrastructure prerequisite: expected hosted Python 3.12; no tests ran.")
          data = json.loads(Path("tools/migration/feature-boundaries.json").read_text(encoding="utf-8-sig"))
          baseline = data.get("sourceBaseline", "")
          if not isinstance(baseline, str) or not re.fullmatch(r"[0-9a-f]{40}", baseline):
              raise SystemExit("Inventory sourceBaseline is not a full commit SHA.")
          result = subprocess.run(["git", "cat-file", "-e", baseline + "^{commit}"])
          if result.returncode:
              raise SystemExit("Infrastructure prerequisite: baseline history unavailable; no tests ran.")
          print("Hosted Python and full baseline history available.")
          PY

      - name: Validate current source inventory
        shell: bash
        run: python3 -B tools/migration/check_feature_boundaries.py

      - name: Run boundary contract and negative tests
        shell: bash
        run: python3 -B -m unittest discover -s tools/migration -p 'test_feature_boundaries.py' -v

  compile:
    needs: migration-boundaries
    # Signature: OpenAI-Codex_release_format_audit
    outputs:
      artifact-id: ${{ steps.public-assets.outputs.artifact-id }}
      build-attempt: ${{ steps.build-identity.outputs.attempt }}
    if: github.repository == 'KingsleyHK0323/Cities_Skylines_1_Modpack' && github.ref == 'refs/heads/AI_Improve'
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - name: Record successful build identity
        id: build-identity
        shell: pwsh
        run: '"attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out encrypted build references
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7b8a5e7c10f2db84388e8dd8af2084f239957b13
          path: build-dependencies
          sparse-checkout: |
            build-references/cs1/v1
            tools/build-references
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore verified game references
        shell: pwsh
        env:
          CS1_GAME_REFERENCES_KEY: ${{ secrets.CS1_GAME_REFERENCES_KEY }}
        run: |
          $gameRoot = Join-Path $env:RUNNER_TEMP 'cs1-game-root'
          & ./build-dependencies/tools/build-references/Restore-GameReferences.ps1 -BundleDirectory ./build-dependencies/build-references/cs1/v1 -GameRoot $gameRoot
          "CS1_GAME_ROOT=$gameRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Development DLL and verify outputs
        shell: pwsh
        run: |
          $modsOutput = Join-Path $env:RUNNER_TEMP 'ai-improve-mods-output'
          New-Item -ItemType Directory -Force -Path $modsOutput | Out-Null
          dotnet --info
          dotnet build AIImprove.csproj --configuration Release --no-incremental -p:DevTools=true "-p:CSInstallPath=$env:CS1_GAME_ROOT" "-p:CitiesSkylinesDir=$env:CS1_GAME_ROOT" "-p:CSDataPath=$modsOutput"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @('bin/Release/AIImprove.dll', 'bin/Release/CitiesHarmony.API.dll', (Join-Path $modsOutput 'AIImprove.dll'))) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -le 0) {
              throw "Required build output missing or empty: $path"
            }
          }
          Write-Output 'Verified nonempty AIImprove.dll, CitiesHarmony.API.dll and temporary deployment DLL.'
      - name: Prepare allowlisted release files
        shell: pwsh
        run: ./tools/Prepare-DevelopmentRelease.ps1 -OutputDirectory '${{ runner.temp }}/ai-improve-release'
      - name: Transfer only allowlisted release files
        uses: actions/upload-artifact@v4
        id: public-assets
        with:
          name: ai-improve-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-improve-release/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: compile
    if: github.repository == 'KingsleyHK0323/Cities_Skylines_1_Modpack' && github.ref == 'refs/heads/AI_Improve'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out publisher only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools
      - name: Receive allowlisted release files
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.compile.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ai-improve-release
      - name: Verify draft assets and publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD_ATTEMPT: ${{ needs.compile.outputs.build-attempt }}
        run: ./tools/Publish-DevelopmentRelease.ps1 -AssetDirectory '${{ runner.temp }}/ai-improve-release'
# Signature: OpenAI-Codex_Responsible: AI_Improve
# Migration validation gate: OpenAI-Codex_AI_Improve.
